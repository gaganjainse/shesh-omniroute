[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shesh-omniroute"
version = "0.1.0"
description = "Shesh wrapper: run the OmniRoute OpenAI-compatible LLM gateway in a rootless container"
authors = [{ name = "Gagan Jain" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shesh-omniroute = "shesh_omniroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# BLE+TRY are errors, not style: blind `except Exception` is where silent
# failures live. See shesh-ecosystem/docs (2026-08-12 silent-failure sweep).
extend-select = ["BLE", "TRY"]
