[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shesh-omniroute"
version = "0.1.0"
description = "Shesh wrapper: run the OmniRoute OpenAI-compatible LLM gateway in a rootless container"
authors = [{ name = "Gagan Jain" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shesh-omniroute = "shesh_omniroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
